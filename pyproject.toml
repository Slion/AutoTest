[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest"
version = "0.1.0"
description = "A small, platform-agnostic device-automation and device-UI test framework."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pyyaml"]

[tool.setuptools.packages.find]
include = ["autotest*"]
